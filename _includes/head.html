<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title %}{{ page.title }}
    {% else %}{{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

  <link rel="stylesheet" href="{{ "/css/main.css" | prepend: site.baseurl }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ "/feed.xml" | prepend: site.baseurl | prepend: site.url }}" />

  <!-- jQuery -->
  <!-- New Local Node Modules Target Paths -->
  <script src="/assets/js/jquery.min.js"></script>
  <script src="/assets/js/jquery-migrate.min.js"></script>
  <!-- moment -->
  <script src="/assets/js/moment.min.js"></script>
  <!-- jquery.rss (deps: jQuery, moment) -->
  <script src="/assets/js/jquery.rss.min.js"></script>
  <!-- Allow header hover links (deps: jQuery) -->
  <link rel="stylesheet" href="/assets/js/font-awesome.min.css">

  <!-- our main... -->
  <script src="/assets/js/main.js"></script>
  <!-- for the News page -->
  <script src='/assets/js/news.js'></script>
  <script src='/assets/js/rss.js'></script>

  <script>
    ((window.gitter = {}).chat = {}).options = {
      room: 'OfflineIMAP/offlineimap3'
    };
  </script>
  <script src="/assets/js/sidecar.js" async defer></script>

</head>
