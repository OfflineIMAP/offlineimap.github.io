name: Deploy Jekyll site with node_modules to Pages

on:
  push:
    branches: ["main"] # Change to "master" if your default branch is master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci # This installs your node_modules on the fly
      - name: Copy jQuery to assets folder
        run: |
          mkdir -p assets/js
          cp node_modules/jquery/dist/jquery.min.js assets/js/
          cp node_modules/jquery-migrate/dist/jquery-migrate.min.js assets/js/
          cp node_modules/moment/min/moment.min.js assets/js/
          cp node_modules/font-awesome/css/font-awesome.min.css assets/js/

      - name: Setup Ruby
        uses: actions/configure-pages-github-pages@v4 # Configures Jekyll for Pages

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
